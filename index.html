<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!--
      탭 아이콘은 실제로 16~32px 로 그려진다. 큰 이미지 하나만 주면 브라우저가 알아서 줄이는데
      그 결과가 뭉개져 강아지 얼굴이 사라진다. 크기별로 미리 줄여 둔 것을 주고 고르게 한다.
      ?v 는 캐시 때문이다. 브라우저는 파비콘을 이름 단위로 오래 붙들고 있어 파일만 바꾸면 안 바뀐다.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="128x128" href="/favicon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <title>EDRdog</title>
    <!--
      링크 미리보기(카카오톡, 슬랙 등). 미리보기 봇은 JS 를 실행하지 않으므로 여기 정적으로 둔다.
      og:image 는 절대 주소여야 한다. 이미지는 랜딩 1장을 1200x630 으로 찍은 것(public/og.png).
      카카오톡은 미리보기를 캐시하므로 바꾼 뒤에는 카카오 공유 디버거에서 캐시를 지운다.
    -->
    <meta name="description" content="서버와 PC에서 일어나는 이상 행동을 실시간으로 잡아내고, 어떤 위협부터 처리해야 할지 짚어 드립니다." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EDRdog" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://edrdog.duckdns.org/" />
    <meta property="og:title" content="EDRdog · 엔드포인트 위협 탐지와 대응" />
    <meta property="og:description" content="서버와 PC에서 일어나는 이상 행동을 실시간으로 잡아내고, 어떤 위협부터 처리해야 할지 짚어 드립니다." />
    <meta property="og:image" content="https://edrdog.duckdns.org/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="흐르는 보안 로그 위에 수많은 이벤트 속에서라는 제목이 있는 EDRdog 첫 화면" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
