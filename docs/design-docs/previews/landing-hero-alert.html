<!doctype html>
<html lang="ko" data-theme="midnight">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EDRdog 랜딩 첫 화면 시안: 위협 표시 + 빛 사이렌 + 실시간 숫자</title>
<link rel="icon" href="logo.png" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" />
<style>
/* 색은 DESIGN.md 2장 값 그대로 */
:root[data-theme='midnight'] {
  --bg:#0a0e17; --shell:#0e1320; --panel:#0d121d; --raised:#151c2b; --hover:#1b2335;
  --line:#1f2838; --line-strong:#2b3549;
  --ink:#eef2f8; --ink-2:#c6cedb; --mid:#97a3b6; --faint:#75819a;
  --accent:#3a72ff; --accent-hi:#5285ff; --accent-ink:#9dbbff;
  --crit:#f04848; --high:#f7811f; --med:#e5b80b; --good:#2fc471;
  --crit-rgb:240,72,72; --high-rgb:247,129,31; --med-rgb:229,184,11; --good-rgb:47,196,113;
  --chip:#111827; --chip-line:#1c2536;
}
:root[data-theme='cloud'] {
  --bg:#eef2f7; --shell:#f7f9fc; --panel:#ffffff; --raised:#f2f5fa; --hover:#e7ecf4;
  --line:#dfe5ee; --line-strong:#cbd3df;
  --ink:#0f1729; --ink-2:#33405a; --mid:#56627a; --faint:#6f7c92;
  --accent:#2f5fe0; --accent-hi:#2652c8; --accent-ink:#2652c8;
  --crit:#cc2936; --high:#b24a00; --med:#8a6500; --good:#1d7a4c;
  --crit-rgb:204,41,54; --high-rgb:178,74,0; --med-rgb:138,101,0; --good-rgb:29,122,76;
  --chip:#ffffff; --chip-line:#dfe5ee;
}
* { box-sizing:border-box; margin:0; }
body { background:var(--bg); color:var(--ink); font-family:'Pretendard Variable',Pretendard,sans-serif; overflow:hidden; transition:background .2s; }
.mono { font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

/* 상단 내비 */
nav { position:fixed; inset:0 0 auto 0; height:60px; display:flex; align-items:center; gap:28px; padding:0 36px; z-index:20; }
.brand { display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
.brand img { width:28px; height:28px; border-radius:50%; box-shadow:0 0 0 2px #fff; }
nav .links { display:flex; gap:22px; font-size:13px; color:var(--mid); }
nav .right { margin-left:auto; display:flex; gap:8px; align-items:center; }
.btn { height:34px; padding:0 14px; border-radius:9px; border:1px solid var(--line-strong); background:transparent; color:var(--ink); font-weight:500; font-size:13px; font-family:inherit; display:inline-flex; align-items:center; cursor:pointer; }
.btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; border-radius:980px; }
.btn.icon { width:34px; padding:0; justify-content:center; }
.btn:active { transform:translateY(1px); }

/* 시안 고르기 */
.picker { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:30; display:flex; gap:4px; padding:5px; border-radius:980px; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.18); }
.picker button { border:0; background:transparent; color:var(--mid); font:500 13px 'Pretendard Variable',sans-serif; padding:8px 16px; border-radius:980px; cursor:pointer; }
.picker button.on { background:var(--accent); color:#fff; }
.note { position:fixed; left:50%; bottom:74px; transform:translateX(-50%); z-index:30; font-size:12px; color:var(--mid); background:var(--panel); padding:6px 14px; border-radius:9px; white-space:nowrap; }

/* 로그 조각이 흐르는 배경 */
.field { position:fixed; inset:0; overflow:hidden; }
.row { position:absolute; left:0; display:flex; gap:0; white-space:nowrap; animation:flow linear infinite; will-change:transform; }
@keyframes flow { to { transform:translateX(-50%); } }
.chip { position:relative; display:inline-flex; align-items:center; gap:8px; height:26px; padding:0 10px; border-radius:9px; background:var(--chip); border:1px solid var(--chip-line); font:400 11.5px 'JetBrains Mono',monospace; color:var(--mid); transition:border-color .2s, color .2s; }
.chip .k { color:var(--faint); }
.row.far .chip { opacity:.45; } .row.mid .chip { opacity:.7; }
/* 제목 뒤는 조각을 흐리게 */
.veil { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse 46% 38% at 50% 50%, var(--bg) 35%, transparent 100%); }

/* 위협으로 잡힌 조각 */
.chip.t { color:var(--ink); opacity:1 !important; z-index:2; }
.chip.t.crit { border-color:var(--crit); }
.chip.t.high { border-color:var(--high); }
.chip.t.med  { border-color:var(--med); }
.badge { display:inline-flex; align-items:center; gap:5px; height:18px; padding:0 8px; border-radius:980px; font:600 10.5px 'Pretendard Variable',sans-serif; }
.badge i { width:6px; height:6px; border-radius:50%; background:currentColor; }
.crit .badge { color:var(--crit); background:rgba(var(--crit-rgb),.14); }
.high .badge { color:var(--high); background:rgba(var(--high-rgb),.14); }
.med  .badge { color:var(--med);  background:rgba(var(--med-rgb),.16); }
.rule { color:var(--faint); font-size:10.5px; }

/* 빛 사이렌 1: 고리가 퍼진다 (V1, V4) */
.ring { position:absolute; inset:-1px; border-radius:9px; border:1.5px solid currentColor; pointer-events:none; animation:ring 1.1s ease-out 3; opacity:0; }
@keyframes ring { 0% { transform:scale(1); opacity:.9; } 100% { transform:scale(1.35,1.9); opacity:0; } }
/* 빛 사이렌 2: 조각이 경광등처럼 두 번 깜빡인다 (V3) */
.blink { position:absolute; inset:0; border-radius:8px; background:currentColor; pointer-events:none; opacity:0; animation:blink .5s steps(1) 4; }
@keyframes blink { 0% { opacity:.22; } 50% { opacity:0; } }
/* 빛 사이렌 3: 심각이면 화면 가장자리가 한 번 붉어진다 (V2) */
.edge { position:fixed; inset:0; pointer-events:none; z-index:15; box-shadow:inset 0 0 140px rgba(var(--crit-rgb),.32); opacity:0; }
.edge.go { animation:edge 1.6s ease-out; }
@keyframes edge { 0%,100% { opacity:0; } 18% { opacity:1; } 40% { opacity:.35; } 55% { opacity:.8; } }
/* 조준 괄호 (V4) */
.aim { position:absolute; inset:-6px -8px; pointer-events:none; color:inherit; animation:aim .45s cubic-bezier(.2,.8,.2,1) both; }
.aim::before, .aim::after { content:''; position:absolute; width:9px; height:9px; border:1.5px solid currentColor; }
.aim::before { left:0; top:0; border-right:0; border-bottom:0; }
.aim::after { right:0; bottom:0; border-left:0; border-top:0; }
@keyframes aim { from { transform:scale(1.7); opacity:0; } to { transform:scale(1); opacity:1; } }
.crit .ring, .crit .blink, .crit .aim { color:var(--crit); }
.high .ring, .high .blink, .high .aim { color:var(--high); }
.med .ring, .med .blink, .med .aim { color:var(--med); }

/* 가운데 제목 */
.hero { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:10; pointer-events:none; }
.hero > * { pointer-events:auto; }
.eb { font:500 11px 'JetBrains Mono',monospace; letter-spacing:.14em; color:var(--accent-ink); margin-bottom:18px; }
h1 { font-size:clamp(44px,6.4vw,84px); font-weight:700; letter-spacing:-.03em; line-height:1.05; }
.sub { margin-top:20px; font-size:16px; line-height:1.65; color:var(--mid); max-width:440px; }
.cta { margin-top:28px; display:flex; gap:10px; }
.cta .btn { height:42px; padding:0 20px; font-size:14px; }

/* 실시간 숫자: 공통 */
.stats { display:flex; align-items:center; gap:22px; font-size:12.5px; color:var(--mid); }
.stats b { font:600 15px 'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; color:var(--ink); margin-left:7px; display:inline-block; transition:color .4s; }
.stats b.hit { color:var(--crit); }
.stats .crit-n { color:var(--crit); }
.live { width:8px; height:8px; border-radius:50%; background:var(--good); position:relative; }
.live::after { content:''; position:absolute; inset:0; border-radius:50%; border:1.5px solid var(--good); animation:livepulse 2.4s ease-out infinite; }
@keyframes livepulse { from { transform:scale(1); opacity:.8; } to { transform:scale(2.8); opacity:0; } }
.sep { width:1px; height:14px; background:var(--line-strong); }

/* V1: 버튼 아래 한 줄 */
.stats.v1 { margin-top:34px; }
/* V2: 내비 바로 아래 관제 줄 */
.stats.v2 { position:fixed; top:60px; left:0; right:0; height:38px; justify-content:center; background:var(--shell); border-block:1px solid var(--line); z-index:19; }
/* V3: 대시보드 신호 스트립 같은 카드 */
.stats.v3 { margin-top:34px; padding:14px 22px; border-radius:14px; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.06); }
.stats.v3 b { font-size:18px; display:block; margin:4px 0 0; text-align:left; }
.stats.v3 > div { text-align:left; }
/* V4: 아래 왼쪽 모서리 HUD */
.stats.v4 { position:fixed; left:36px; bottom:28px; flex-direction:column; align-items:flex-start; gap:8px; padding:14px 18px; border-radius:14px; background:var(--panel); box-shadow:0 1px 2px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.12); z-index:19; }
.stats.v4 > div { display:flex; justify-content:space-between; width:180px; }
.stats.v4 .sep { display:none; }

@media (prefers-reduced-motion: reduce) {
  .row, .ring, .blink, .edge, .aim, .live::after { animation:none !important; }
}
</style>
</head>
<body>
<nav>
  <div class="brand"><img src="logo.png" alt="" />EDRdog</div>
  <div class="links"><span>동작 방식</span><span>위협 지도</span><span>기능</span></div>
  <div class="right">
    <button class="btn icon" id="theme" aria-label="라이트 테마로 바꾸기"></button>
    <button class="btn">로그인</button>
    <button class="btn primary">데모 보기</button>
  </div>
</nav>

<div class="field" id="field"></div>
<div class="veil"></div>
<div class="edge" id="edge"></div>

<main class="hero">
  <p class="eb">ENDPOINT DETECTION &amp; RESPONSE</p>
  <h1>수많은 이벤트 속에서</h1>
  <p class="sub">서버와 PC에서 일어나는 이상 행동을 실시간으로 잡아내고, 어떤 위협부터 처리해야 할지 짚어 드립니다.</p>
  <div class="cta"><button class="btn primary">데모 보기</button><button class="btn">로그인</button></div>
  <div id="statsSlot"></div>
</main>

<div class="stats" id="stats">
  <span class="live" aria-hidden="true"></span>
  <div>오늘 수집<b id="n-all">182,403</b></div><span class="sep"></span>
  <div>탐지한 위협<b id="n-det">5</b></div><span class="sep"></span>
  <div>심각<b id="n-crit" class="crit-n">2</b></div>
</div>

<p class="note" id="note"></p>
<div class="picker" id="picker">
  <button data-v="1">V1 고리</button>
  <button data-v="2">V2 가장자리 경보</button>
  <button data-v="3">V3 경광등 깜빡임</button>
  <button data-v="4">V4 조준 + 고리</button>
</div>

<script>
// 평범한 로그 조각
const LOGS = [
  ['dns','cdn.jsdelivr.net'],['proc','chrome.exe --type=renderer'],['net','10.0.8.5 › 10.0.8.1:53'],['file','invoice.docx'],
  ['reg','HKCU\\..\\RecentDocs'],['auth','sudo -u root'],['proc','python3 sync.py --all'],['dns','api.github.com'],
  ['proc','sshd -D'],['file','/var/log/auth.log'],['net','10.0.2.31 › 52.84.12.7:443'],['proc','node server.js'],
  ['file','report_q3.xlsx'],['proc','excel.exe /e -embedding'],['dns','x7k2.duckdns.org'],['proc','cmd.exe /c whoami'],
  ['auth','kerberos tgt park'],['file','~/.ssh/known_hosts'],['net','10.0.4.12 › 10.0.4.20:445'],['proc','svchost.exe -k netsvcs'],
]
// 위협으로 잡힐 때 바뀌는 내용 (등급, 종류, 로그, 규칙)
const THREATS = [
  ['crit','proc','vssadmin delete shadows /all','T1490'],
  ['crit','proc','rundll32 comsvcs.dll MiniDump 624','T1003.001'],
  ['crit','file','*.docx → *.locked ×312','T1486'],
  ['high','proc','powershell.exe -enc JABzAD0A…','T1059.001'],
  ['high','reg','HKCU\\..\\Run\\updater','T1547.001'],
  ['high','net','10.0.4.12 › 185.220.101.4:443','T1090'],
  ['med','auth','sshd 로그인 실패 ×48','T1110'],
]
const LABEL = { crit:'심각', high:'높음', med:'보통' }
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches
const $ = (s) => document.querySelector(s)
let V = 1

// 배경 줄을 만든다 (한 줄 = 같은 조각을 두 번 이어 붙여 끊김 없이 흐르게)
const field = $('#field')
const ROWS = Math.ceil(innerHeight / 46)
for (let r = 0; r < ROWS; r++) {
  const row = document.createElement('div')
  row.className = 'row ' + ['far','mid',''][r % 3]
  row.style.top = 70 + r * 46 + 'px'
  row.style.animationDuration = 70 + ((r * 37) % 60) + 's'
  row.style.animationDelay = -((r * 13) % 50) + 's'
  const items = []
  for (let i = 0; i < 9; i++) items.push(LOGS[(r * 7 + i * 3) % LOGS.length])
  const html = items.map(([k, t], i) => `<span class="chip" style="margin-right:${40 + ((r * 5 + i * 11) % 9) * 22}px"><span class="k">${k}</span>${t}</span>`).join('')
  row.innerHTML = html + html
  field.appendChild(row)
}

// 숫자 줄: 오늘 수집은 계속 오르고, 위협이 잡히면 탐지·심각이 오른다
const fmt = (n) => n.toLocaleString('en-US')
let all = 182403, det = 5, crit = 2
if (!REDUCE) setInterval(() => { all += 3 + Math.floor(Math.random() * 18); $('#n-all').textContent = fmt(all) }, 140)
function bump(id, val) { const b = $(id); b.textContent = val; b.classList.add('hit'); setTimeout(() => b.classList.remove('hit'), 900) }

// 화면에 보이고 제목과 겹치지 않는 조각 하나를 고른다
function pick() {
  const hero = { l: innerWidth * .26, r: innerWidth * .74, t: innerHeight * .26, b: innerHeight * .78 }
  const ok = [...document.querySelectorAll('.chip:not(.t)')].filter((c) => {
    const b = c.getBoundingClientRect()
    if (b.left < innerWidth * .2 || b.right > innerWidth - 30 || b.top < 110 || b.bottom > innerHeight - 120) return false
    return b.right < hero.l || b.left > hero.r || b.bottom < hero.t || b.top > hero.b
  })
  return ok[Math.floor(Math.random() * ok.length)]
}

// 조각 하나를 위협으로 표시하고 버전별 빛 사이렌을 켠다
function flag(threat) {
  const c = pick(); if (!c) return
  // 지금 화면에 없는 위협 중에서 고른다
  const shown = [...document.querySelectorAll('.chip.t')].map((x) => x.dataset.rule)
  const pool = THREATS.filter((x) => !shown.includes(x[3]))
  const [sev, k, text, rule] = threat || pool[Math.floor(Math.random() * pool.length)]
  c.dataset.rule = rule
  c.dataset.old = c.innerHTML
  c.className = `chip t ${sev}`
  c.innerHTML = `<span class="k">${k}</span>${text}<span class="badge"><i></i>${LABEL[sev]}</span><span class="rule">${rule}</span>`
  if (REDUCE) return
  if (V === 1) c.insertAdjacentHTML('beforeend', '<span class="ring"></span>')
  if (V === 2) { c.insertAdjacentHTML('beforeend', '<span class="ring"></span>'); if (sev === 'crit') { const e = $('#edge'); e.classList.remove('go'); void e.offsetWidth; e.classList.add('go') } }
  if (V === 3) c.insertAdjacentHTML('beforeend', '<span class="blink"></span>')
  if (V === 4) { c.insertAdjacentHTML('beforeend', '<span class="aim"></span>'); setTimeout(() => c.insertAdjacentHTML('beforeend', '<span class="ring"></span>'), 450) }
  bump('#n-det', ++det)
  if (sev === 'crit') bump('#n-crit', ++crit)
  setTimeout(() => unflag(c), 6500)
}
function unflag(c) { if (!c.dataset.old) return; c.className = 'chip'; c.innerHTML = c.dataset.old; delete c.dataset.old; delete c.dataset.rule }

// 버전 바꾸기: 숫자 줄 위치와 설명만 바꾼다
const NOTES = {
  1: 'V1 · 위협 조각 둘레에 고리가 세 번 퍼진다. 숫자 줄은 버튼 아래 한 줄',
  2: 'V2 · 고리 + 심각이면 화면 가장자리가 한 번 붉어진다. 숫자 줄은 내비 아래 관제 줄',
  3: 'V3 · 위협 조각이 경광등처럼 두 번 깜빡인다. 숫자 줄은 대시보드 신호 스트립 카드',
  4: 'V4 · 괄호가 조준해 잡은 뒤 고리가 퍼진다. 숫자 줄은 왼쪽 아래 관제 패널',
}
function setV(v) {
  V = v
  document.querySelectorAll('.picker button').forEach((b) => b.classList.toggle('on', +b.dataset.v === v))
  const s = $('#stats'); s.className = 'stats v' + v
  ;(v === 1 || v === 3 ? $('#statsSlot') : document.body).appendChild(s)
  $('#note').textContent = NOTES[v]
  document.querySelectorAll('.chip.t').forEach(unflag)
  flag(THREATS[0]); setTimeout(() => flag(THREATS[3]), 700)
}
$('#picker').addEventListener('click', (e) => { const v = e.target.dataset.v; if (v) setV(+v) })

// 해·달 테마 버튼
const SUN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f7811f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>'
const MOON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2f5fe0" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>'
const tbtn = $('#theme')
function paintTheme() { const dark = document.documentElement.dataset.theme === 'midnight'; tbtn.innerHTML = dark ? SUN : MOON; tbtn.setAttribute('aria-label', dark ? '라이트 테마로 바꾸기' : '다크 테마로 바꾸기') }
tbtn.onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'midnight' ? 'cloud' : 'midnight'; paintTheme() }
paintTheme()

// 시작: 주소 뒤 #2 처럼 버전을 고를 수 있다
setV(+(location.hash.slice(1)) || 1)
if (!REDUCE) setInterval(() => { if (document.querySelectorAll('.chip.t').length < 3) flag() }, 2300)
</script>
</body>
</html>
